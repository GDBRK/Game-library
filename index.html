<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 Библиотека Вани</title>
  <style>
    :root {
      --bg: #0f0f13; --card: #1a1a24; --text: #e6e6ef;
      --accent: #7c5cff; --border: #3a3a50; --muted: #8888aa;
      --c-red: #ef4444; --c-yellow: #fbbf24; --c-green: #4ade80; --c-purple: #7c5cff;
      --review-bg: #1a1a24; --review-text: #e0e0f0;
    }
    [data-theme="light"] {
      --bg: #f5f5fa; --card: #ffffff; --text: #1a1a2e;
      --accent: #6c5ce7; --border: #d0d0e0; --muted: #666688;
      --c-red: #dc2626; --c-yellow: #d97706; --c-green: #16a34a; --c-purple: #7c3aed;
      --review-bg: #f8f8ff; --review-text: #2a2a4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      padding: 16px; line-height: 1.5; transition: background 0.3s, color 0.3s;
    }
    header {
      text-align: center; margin-bottom: 20px; padding: 20px;
      background: linear-gradient(135deg, var(--card), #252535);
      border-radius: 16px; border: 1px solid var(--border);
      position: relative;
    }
    [data-theme="light"] header { background: linear-gradient(135deg, var(--card), #e8e8f5); }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    #stats { color: var(--muted); font-size: 0.95rem; }
    #refreshBtn {
      position: absolute; top: 12px; left: 16px;
      background: var(--accent); color: white; border: none;
      padding: 6px 12px; border-radius: 20px; cursor: pointer;
      font-size: 0.9rem; display: flex; align-items: center; gap: 4px;
    }
    #refreshBtn:hover { opacity: 0.9; }
    #themeToggle {
      position: absolute; top: 12px; right: 16px;
      background: var(--accent); color: white; border: none;
      padding: 6px 12px; border-radius: 20px; cursor: pointer;
      font-size: 0.9rem; display: flex; align-items: center; gap: 4px;
    }
    #themeToggle:hover { opacity: 0.9; }
    
    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      margin: 12px 0; padding: 12px; background: var(--card);
      border-radius: 12px; border: 1px solid var(--border);
    }
    .filters select, .filters input {
      padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.9rem;
      min-width: 140px;
    }
    .filters input { min-width: 180px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card {
      background: var(--card); border-radius: 12px; padding: 14px;
      border-left: 4px solid var(--accent); border: 1px solid var(--border);
      transition: transform 0.2s; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    
    .card-image {
      width: 100%; height: 160px; border-radius: 8px; margin-bottom: 10px;
      background: var(--card); overflow: hidden; position: relative;
    }
    .card-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem; font-weight: bold; color: white; text-shadow: 0 2px 6px rgba(0,0,0,0.6);
      background: linear-gradient(135deg, var(--accent), #4a3dff);
    }
    .loading-cover {
      width: 100%; height: 100%;
      background: linear-gradient(90deg, var(--card) 25%, #2a2a3a 50%, var(--card) 75%);
      background-size: 200% 100%; animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
    .game-title { font-weight: 600; font-size: 1.05rem; line-height: 1.3; }
    
    .rating {
      color: white; padding: 3px 9px; border-radius: 16px; font-weight: bold; font-size: 0.9rem;
      min-width: 48px; text-align: center; flex-shrink: 0;
    }
    .rating.red { background: var(--c-red); }
    .rating.yellow { background: var(--c-yellow); color: #1a1a24; }
    .rating.green { background: var(--c-green); color: #1a1a24; }
    .rating.purple { background: var(--c-purple); }
    .rating.empty { background: var(--border); color: var(--muted); }

    .verdict {
      display: inline-block; padding: 2px 9px; border-radius: 10px;
      font-size: 0.82rem; font-weight: 600; margin-bottom: 8px;
    }
    .verdict.пик { background: var(--c-purple); color: white; }
    .verdict.рекомендую { background: var(--c-green); color: #1a1a24; }
    .verdict.можно { background: var(--c-yellow); color: #1a1a24; }
    .verdict.не-рекомендую, .verdict.дроп { background: var(--c-red); color: white; }
    
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 0.88rem; color: var(--muted); margin: 8px 0; }
    .review {
      font-size: 0.92rem; color: var(--text); margin-top: 8px;
      padding-top: 8px; border-top: 1px dashed var(--border); margin-top: auto;
    }
    .review-btn {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--accent); text-decoration: none; font-weight: 500; cursor: pointer;
    }
    .review-btn:hover { text-decoration: underline; }
    
    /* 📄 Модальное окно обзора */
    #reviewModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto;
      backdrop-filter: blur(5px);
    }
    #reviewModal.active { display: block; }
    .review-container {
      max-width: 900px; margin: 40px auto; padding: 20px;
      background: var(--review-bg); border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .review-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }
    #reviewTitle { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    #closeReview {
      background: var(--c-red); color: white; border: none;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      font-size: 0.95rem; font-weight: 600;
    }
    #closeReview:hover { opacity: 0.9; }
    #reviewContent {
      color: var(--review-text); line-height: 1.8; font-size: 1.05rem;
      white-space: pre-wrap;
    }
    #reviewContent h1, #reviewContent h2, #reviewContent h3 {
      color: var(--accent); margin: 1.5em 0 0.8em; font-weight: 700;
    }
    #reviewContent p { margin: 0.8em 0; }
    #reviewContent ul, #reviewContent ol { margin: 0.8em 0; padding-left: 2em; }
    #reviewContent li { margin: 0.4em 0; }
    #reviewContent strong { color: var(--accent); font-weight: 700; }
    .loading-review { text-align: center; padding: 40px; color: var(--muted); font-size: 1.1rem; }
    
    .error-msg {
      background: var(--c-red); color: white; padding: 12px;
      border-radius: 8px; margin: 10px 0; text-align: center;
    }
    
    @media (max-width: 600px) {
      .meta { grid-template-columns: 1fr; }
      .filters { flex-direction: column; align-items: stretch; }
      .filters select, .filters input { min-width: 100%; }
      .review-header { flex-direction: column; gap: 12px; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <button id="refreshBtn">🔄 Обновить</button>
    <h1>🎮 Библиотека пройденных игр</h1>
    <p id="stats">Загрузка...</p>
    <button id="themeToggle">🌓 Тема</button>
  </header>

  <div class="filters">
    <select id="filterVerdict">
      <option value="">Все вердикты</option>
      <option value="пик">🔥 Пик</option>
      <option value="рекомендую">✅ Рекомендую</option>
      <option value="можно попробовать">🤔 Можно попробовать</option>
      <option value="не рекомендую">❌ Не рекомендую</option>
      <option value="дроп">🗑️ Дроп</option>
    </select>
    <select id="filterGenre"><option value="">Все жанры</option></select>
    <input type="text" id="search" placeholder="🔍 Поиск по названию..." />
    <select id="sortBy">
      <option value="date-desc">Сначала новые</option>
      <option value="date-asc">Сначала старые</option>
      <option value="rating-desc">По оценке ↑</option>
      <option value="rating-asc">По оценке ↓</option>
      <option value="hours-desc">По часам ↑</option>
    </select>
  </div>

  <div id="gamesGrid" class="grid"></div>

  <!-- 📄 Модальное окно обзора -->
  <div id="reviewModal">
    <div class="review-container">
      <div class="review-header">
        <h2 id="reviewTitle">Название игры</h2>
        <button id="closeReview">✕ Закрыть</button>
      </div>
      <div id="reviewContent"><div class="loading-review">⏳ Загрузка обзора...</div></div>
    </div>
  </div>

  <script>
    // 🔗 Ссылка на твою опубликованную таблицу
    const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSciyV_DMHERawDqSkbql2-VRBBoJtKk6oci3j5YIq0xH08LynohFZM8TMvExAqVJXOaqSNrKugIgkn/pub?output=csv';
    
    // 🔗 Ссылки на обзоры
    const REVIEW_LINKS = {
      'Resident Evil 4 Remake': 'https://docs.google.com/document/d/e/2PACX-1vQfFqOvbjSJVYbIRZCitrcJIVpwYheES82b4n2T5mlb005--xZKB3n4kKllAYXDzD-zysm5Mu3paDl8/pub?output=txt',
      'Resident Evil 9 Requiem': 'https://docs.google.com/document/d/e/2PACX-1vSV53Isdo5_eX-mWad1gdBomF1MHDHlNLYoeGJO9EO84iRMkZtnue-Wv_XBwbpcdn4vEs54HxNKTbun/pub?output=txt',
      'Lies of P': 'https://docs.google.com/document/d/e/2PACX-1vSqi0ZivoRO_0WjMW9lscZxDxkgtV2NopwhhfXKZ4y2t6kmSyTqSjgHHQMOOZI-eH4geG9-SHVm_vMz/pub?output=txt',
      'Ghost of Tsushima': 'https://docs.google.com/document/d/e/2PACX-1vTl_erKecH-Z_6ZnwpapQ3uCiqsZBAyAKNN_HP8Q80BtOco9I2rdtVooNGNWdfLLCTX4f1UOpAnaslz/pub?output=txt',
      'Sekiro': 'https://docs.google.com/document/d/e/2PACX-1vTxCM8Sx1GTKqF1bYJYWC9KIl3RruAQsCp1ootAPyfrjVMil19_WwQR_s_KuNLLfLvGTDY966wbZlPa/pub?output=txt',
      'Black Myth: Wukong': 'https://docs.google.com/document/d/e/2PACX-1vS24EHezBL2T-moSXMxugV5Mh-kya9orSip-1IhIXOINnJ54t_N-cqIT2LNV1FVD6-uQylSWs3YFdZi/pub?output=txt',
      'Clair Obscur: Expedition 33': 'https://docs.google.com/document/d/e/2PACX-1vTn4_qJI36p5mYDMkWFY0RK7RZqyej9GRpUGOCEhyqt2emWeKcBjdJr6P8fsLX3Glem0GB9zXLzR37T/pub?output=txt',
      'The Last of Us Part I': 'https://docs.google.com/document/d/e/2PACX-1vTk-JtsIIup1ffLV3c28bTTjdTyv5VLt3IIoAqKIrlVhLMgtZxvs33whw_wkgjg8ROqDQAFCSqACB6n/pub?output=txt',
      'Castlevania: Lords of Shadow 2': 'https://docs.google.com/document/d/e/2PACX-1vTdsRaa3_fcIzyUonUnUEWMvUh9pn4D-VJ4QOIGFFkPH3uVs3ipjLn7EK6osnz4ty0GQgVlEfqmPKxF/pub?output=txt',
      'Hollow Knight: Silksong': 'https://docs.google.com/document/d/e/2PACX-1vRFzpuwtzznTpxAACc57PeKUoxXsu48zpcpN-4657uYlqugJiLzOx1_hjLP4DLvtVmTgiPxQIHNXt2v/pub?output=txt',
      'Persona 5 Royal': 'https://docs.google.com/document/d/e/2PACX-1vRG8iRjYXm3vlwy-yWkZrIvSitqHhkZjaKU4xamhSsPmwaMuo6Vi53qkN1QP2sxk9cQUP_L07_0QdAT/pub?output=txt',
      'Bayonetta': 'https://docs.google.com/document/d/e/2PACX-1vSpGmSws1wbCo_tB2kuD-GDT7cBi5nafi45m2T7OWH1F9FZSIS9d-QBtZ_RkKmMb3m0d-TNi6nagUcu/pub?output=txt',
      'God of War 2018': 'https://docs.google.com/document/d/e/2PACX-1vRYTFMGq9QRhNTeUYelPqxgQ-cxAV0jPIs5t8KAK2xR_QBIrjfCKDx3Zn2eAo0bjJDYSAZn3AxxWIdq/pub?output=txt',
      'Bloodborne': 'https://docs.google.com/document/d/e/2PACX-1vTzRgfDSsAI5PT2c103bmO7UnW9bBluvgPZLJD_GnPuXS4RxNeJyk144B4UvVTN_KYETv0LQQEZ7-KN/pub?output=txt',
      'SILENT HILL f': 'https://docs.google.com/document/d/e/2PACX-1vQn_4O2U7aGv0WvYhNqJj1Wz9QE5APMMqzeDczLzkuqWpcKJ2cLv5lQh0Ag3gDIL4JIYqeKq96AVJU8/pub?output=txt',
      'The First Berserker: Khazan': 'https://docs.google.com/document/d/e/2PACX-1vTtRrXtG9S99uxYC4OeMbPSgoVu4fz2axq2xu0whszX4NnzNqqSwhitOyMLlusV3oeRdE7zQyK2WcK1/pub?output=txt'
    };

    let games = [];
    const coverCache = JSON.parse(localStorage.getItem('gameCovers') || '{}');

    // 📥 Загрузка данных из таблицы
    async function loadGamesData() {
      try {
        // Используем CORS-прокси
        const proxyUrl = 'https://api.allorigins.win/raw?url=';
        const response = await fetch(proxyUrl + encodeURIComponent(SHEET_CSV));
        if (!response.ok) throw new Error('Не удалось загрузить таблицу');
        const csvText = await response.text();
        return parseCSV(csvText);
      } catch (error) {
        console.error('Ошибка загрузки:', error);
        // Если не получилось через прокси, пробуем напрямую
        try {
          const response = await fetch(SHEET_CSV + '&t=' + Date.now());
          if (!response.ok) throw new Error('Не удалось загрузить таблицу');
          const csvText = await response.text();
          return parseCSV(csvText);
        } catch (e) {
          console.error('Ошибка (прямой доступ):', e);
          throw e;
        }
      }
    }

    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) return [];
      const headers = parseLine(lines[0]);
      const result = [];
      for (let i = 1; i < lines.length; i++) {
        const values = parseLine(lines[i]);
        if (values.length !== headers.length) continue;
        const game = {};
        headers.forEach((h, idx) => {
          let val = values[idx] || '';
          if ((h === 'ЧАСОВ' || h === '%') && val && val.includes(',')) val = val.replace(',', '.');
          game[h.trim()] = val.trim();
        });
        if (game['ИГРА']) result.push(game);
      }
      return result;
    }

    function parseLine(line) {
      const result = []; let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i], n = line[i+1];
        if (c === '"') { if (inQ && n === '"') { cur += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
        else cur += c;
      }
      result.push(cur.trim());
      return result.map(v => v.replace(/^"|"$/g, ''));
    }

    function fmtVerdict(v) {
      if (!v) return '';
      const key = v.toLowerCase().trim();
      if (key.includes('пик')) return `<span class="verdict пик">Пик</span>`;
      if (key.includes('рекомендую') && !key.includes('не')) return `<span class="verdict рекомендую">Рекомендую</span>`;
      if (key.includes('можно')) return `<span class="verdict можно">Можно попробовать</span>`;
      if (key.includes('не рекомендую') || key.includes('дроп')) return `<span class="verdict не-рекомендую">${v}</span>`;
      return `<span class="verdict можно">${v}</span>`;
    }

    function fmtNum(val) {
      if (!val) return '';
      const n = parseFloat(val);
      return isNaN(n) ? val : n % 1 === 0 ? n.toString() : n.toFixed(1);
    }

    function getRatingClass(rating) {
      const r = parseFloat(rating);
      if (isNaN(r)) return 'empty';
      if (r <= 4) return 'red';
      if (r <= 6) return 'yellow';
      if (r <= 8) return 'green';
      return 'purple';
    }

    // 🖼️ Загрузка обложек
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          loadCover(img, img.dataset.title);
          observer.unobserve(img);
        }
      });
    }, { rootMargin: '200px' });

    async function loadCover(img, title) {
      img.classList.add('loading-cover');
      
      // Проверяем кэш
      if (coverCache[title]) {
        img.src = coverCache[title];
        img.onload = () => {
          img.classList.remove('loading-cover');
          console.log(`✅ Обложка загружена из кэша: ${title}`);
        };
        img.onerror = () => {
          console.warn(`❌ Ошибка кэша для: ${title}`);
          delete coverCache[title];
          localStorage.setItem('gameCovers', JSON.stringify(coverCache));
          setPlaceholder(img, title);
        };
        return;
      }
      
      await tryNextSource(img, title);
    }

    async function tryNextSource(img, title, attempt = 0) {
      const sources = [
        { name: 'RAWG', fn: () => fetchFromRAWG(title) },
        { name: 'GOG', fn: () => fetchFromGOG(title) },
        { name: 'Steam', fn: () => fetchFromSteam(title) },
        { name: 'IGDB', fn: () => fetchFromIGDB(title) }
      ];
      
      if (attempt >= sources.length) {
        console.warn(`⚠️ Не удалось найти обложку: ${title}`);
        setPlaceholder(img, title);
        return;
      }
      
      try {
        await new Promise(r => setTimeout(r, 400 * attempt));
        const source = sources[attempt];
        console.log(`🔍 Поиск обложки в ${source.name}: ${title}`);
        const url = await source.fn();
        
        if (url) {
          coverCache[title] = url;
          localStorage.setItem('gameCovers', JSON.stringify(coverCache));
          img.src = url;
          img.onload = () => {
            img.classList.remove('loading-cover');
            console.log(`✅ Обложка найдена в ${source.name}: ${title}`);
          };
          img.onerror = () => {
            console.warn(`❌ Ошибка загрузки из ${source.name}`);
            tryNextSource(img, title, attempt + 1);
          };
        } else {
          console.log(`⚠️ Не найдено в ${source.name}, пробуем следующий...`);
          tryNextSource(img, title, attempt + 1);
        }
      } catch (e) {
        console.warn(`❌ Ошибка ${sources[attempt].name}:`, e.message);
        tryNextSource(img, title, attempt + 1);
      }
    }

    async function fetchFromRAWG(title) {
      try {
        const res = await fetch(`https://api.rawg.io/api/games?key=demo&search=${encodeURIComponent(title)}&page_size=1`);
        const data = await res.json();
        if (data.results?.[0]?.background_image) return data.results[0].background_image;
      } catch (e) {}
      return null;
    }

    async function fetchFromGOG(title) {
      try {
        const res = await fetch(`https://api.gog.com/v2/games/search?query=${encodeURIComponent(title)}&limit=1`);
        const data = await res.json();
        if (data.products?.[0]?.cover_product_v2_id) {
          return `https://images.gog.com/${data.products[0].cover_product_v2_id}.jpg`;
        }
      } catch (e) {}
      return null;
    }

    async function fetchFromSteam(title) {
      try {
        const res = await fetch(`https://store.steampowered.com/api/storesearch?cc=ru&l=russian&term=${encodeURIComponent(title)}`);
        const data = await res.json();
        if (data.items?.[0]?.id) {
          return `https://cdn.akamai.steamstatic.com/steam/apps/${data.items[0].id}/header.jpg`;
        }
      } catch (e) {}
      return null;
    }

    async function fetchFromIGDB(title) {
      try {
        // Упрощённый запрос без авторизации
        const res = await fetch(`https://www.igdb.com/api/games?search=${encodeURIComponent(title)}&fields=cover.url&limit=1`);
        const data = await res.json();
        if (data.length > 0 && data[0].cover?.url) {
          return `https:${data[0].cover.url.replace('t_thumb', 't_cover_big')}`;
        }
      } catch (e) {}
      return null;
    }

    function setPlaceholder(img, title) {
      img.classList.remove('loading-cover');
      const initials = title.split(' ').filter(Boolean).map(w => w[0]).join('').substring(0, 2).toUpperCase();
      img.outerHTML = `<div class="cover-placeholder">${initials}</div>`;
    }

    // 📄 Функции обзоров
    function getReviewLink(gameTitle) {
      return REVIEW_LINKS[gameTitle] || null;
    }

    async function loadReviewContent(gameTitle) {
      const link = getReviewLink(gameTitle);
      if (!link) return '<div class="error-msg">❌ Обзор для этой игры пока не добавлен</div>';
      
      try {
        // Используем прокси для обхода CORS
        const proxyUrl = 'https://api.allorigins.win/raw?url=';
        const response = await fetch(proxyUrl + encodeURIComponent(link));
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const text = await response.text();
        
        // Форматируем текст (простая разметка)
        let formatted = text
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/__(.+?)__/g, '<strong>$1</strong>')
          .replace(/\n\n/g, '</p><p>')
          .replace(/\n/g, '<br>');
        
        return '<p>' + formatted + '</p>';
      } catch (e) {
        console.error('Ошибка загрузки обзора:', e);
        return '<div class="error-msg">❌ Не удалось загрузить обзор. Попробуйте позже.</div>';
      }
    }

    function openReview(gameTitle) {
      const modal = document.getElementById('reviewModal');
      const titleEl = document.getElementById('reviewTitle');
      const contentEl = document.getElementById('reviewContent');
      
      titleEl.textContent = gameTitle;
      contentEl.innerHTML = '<div class="loading-review">⏳ Загрузка обзора...</div>';
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      
      loadReviewContent(gameTitle).then(content => {
        contentEl.innerHTML = content;
      });
    }

    function closeReview() {
      document.getElementById('reviewModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // 🌓 Тема
    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }

    function renderGames(list) {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';
      if (!list.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Ничего не найдено 😕</p>';
        return;
      }
      
      list.forEach(g => {
        const card = document.createElement('div');
        card.className = 'card';
        const hours = g['ЧАСОВ'] ? `⏱ ${fmtNum(g['ЧАСОВ'])} ч` : '';
        const ach = g['ДОСТИЖЕНИЯ'] || '';
        const pct = g['%'] ? `(${g['%'].replace('%', '')}%)` : '';
        const rating = g['ОЦЕНКА'] ? `${g['ОЦЕНКА']}/10` : '–';
        const ratingClass = getRatingClass(g['ОЦЕНКА']);
        
        // Обработка обзора
        let reviewHtml = '';
        const reviewVal = g['ОБЗОР']?.trim();
        if (reviewVal) {
          const link = getReviewLink(g['ИГРА']);
          if (link) {
            reviewHtml = `<div class="review"><span class="review-btn" data-game="${g['ИГРА']}">📄 Читать обзор →</span></div>`;
          } else if (reviewVal !== '–' && !reviewVal.startsWith('http')) {
            reviewHtml = `<div class="review">💬 ${reviewVal}</div>`;
          }
        }
        
        card.innerHTML = `
          <div class="card-image"><img data-title="${g['ИГРА']}" alt="${g['ИГРА']}"></div>
          <div class="card-header">
            <div class="game-title">${g['ИГРА']}</div>
            <div class="rating ${ratingClass}">${rating}</div>
          </div>
          ${fmtVerdict(g['ВЫВОД'])}
          <div class="meta">
            <div>🎭 ${g['Жанр'] || '—'}</div>
            <div>📅 ${g['ДАТА ПРОХОЖДЕНИЯ'] || '—'}</div>
            <div>${hours}</div>
            <div>${ach ? '🏆 ' + ach : ''} ${pct}</div>
          </div>
          ${reviewHtml}
        `;
        grid.appendChild(card);
        observer.observe(card.querySelector('img'));
        
        // Клик по кнопке обзора
        const reviewBtn = card.querySelector('.review-btn');
        if (reviewBtn) {
          reviewBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openReview(g['ИГРА']);
          });
        }
      });
    }

    function updateStats(list) {
      const statsEl = document.getElementById('stats');
      const total = list.length;
      const rated = list.filter(g => g['ОЦЕНКА'] && !isNaN(+g['ОЦЕНКА']));
      const avg = rated.length ? (rated.reduce((s,g) => s + +g['ОЦЕНКА'], 0) / rated.length).toFixed(1) : '–';
      const totalHours = list.reduce((s,g) => {
        const h = parseFloat((g['ЧАСОВ']||'').replace(',','.'));
        return s + (isNaN(h) ? 0 : h);
      }, 0).toFixed(1);
      statsEl.textContent = `Игр: ${total} | Ср. оценка: ${avg} | Всего часов: ${totalHours}`;
    }

    function populateGenres(list) {
      const select = document.getElementById('filterGenre');
      while (select.options.length > 1) select.remove(1);
      const genres = [...new Set(list.map(g => g['Жанр']).filter(Boolean))].sort();
      genres.forEach(genre => {
        const opt = document.createElement('option');
        opt.value = genre;
        opt.textContent = genre;
        select.appendChild(opt);
      });
    }

    function filterAndRender() {
      const verdict = document.getElementById('filterVerdict').value.toLowerCase();
      const genre = document.getElementById('filterGenre').value;
      const search = document.getElementById('search').value.toLowerCase();
      const sort = document.getElementById('sortBy').value;
      
      let filtered = games.filter(g => {
        const v = (g['ВЫВОД']||'').toLowerCase();
        const matchV = !verdict || v.includes(verdict);
        const matchG = !genre || g['Жанр'] === genre;
        const matchS = !search || g['ИГРА'].toLowerCase().includes(search);
        return matchV && matchG && matchS;
      });
      
      const [field, order] = sort.split('-');
      const mult = order === 'asc' ? 1 : -1;
      filtered.sort((a,b) => {
        if (field === 'rating') return ((parseFloat(a['ОЦЕНКА'])||0) - (parseFloat(b['ОЦЕНКА'])||0)) * mult;
        if (field === 'hours') {
          const ha = parseFloat((a['ЧАСОВ']||'').replace(',','.'))||0;
          const hb = parseFloat((b['ЧАСОВ']||'').replace(',','.'))||0;
          return (ha - hb) * mult;
        }
        if (field === 'date') {
          const parse = d => { if (!d) return 0; const [day,mon,yr] = d.split('.'); return new Date(yr, mon-1, day).getTime() || 0; };
          return (parse(a['ДАТА ПРОХОЖДЕНИЯ']) - parse(b['ДАТА ПРОХОЖДЕНИЯ'])) * mult;
        }
        return 0;
      });
      
      renderGames(filtered);
    }

    async function init() {
      initTheme();
      
      const refreshBtn = document.getElementById('refreshBtn');
      const statusEl = document.createElement('div');
      statusEl.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--accent);color:white;padding:10px 20px;border-radius:20px;z-index:100;display:none;';
      document.body.appendChild(statusEl);
      
      async function loadData(showStatus = false) {
        if (showStatus) {
          statusEl.textContent = '🔄 Обновление...';
          statusEl.style.display = 'block';
        }
        
        try {
          games = await loadGamesData();
          populateGenres(games);
          updateStats(games);
          filterAndRender();
          console.log(`✅ Загружено ${games.length} игр из таблицы`);
          
          if (showStatus) {
            statusEl.textContent = '✅ Обновлено!';
            setTimeout(() => statusEl.style.display = 'none', 2000);
          }
        } catch (e) {
          console.error('Ошибка загрузки:', e);
          if (showStatus) {
            statusEl.textContent = '❌ Ошибка обновления';
            statusEl.style.background = 'var(--c-red)';
            setTimeout(() => statusEl.style.display = 'none', 3000);
          }
        }
      }
      
      refreshBtn.addEventListener('click', () => loadData(true));
      await loadData(false);
      
      // Закрытие обзора
      document.getElementById('closeReview').addEventListener('click', closeReview);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeReview();
      });
      
      // Закрытие по клику вне модалки
      document.getElementById('reviewModal').addEventListener('click', (e) => {
        if (e.target.id === 'reviewModal') closeReview();
      });
    }

    ['filterVerdict','filterGenre','search','sortBy'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', filterAndRender);
      el.addEventListener('change', filterAndRender);
    });

    init();
  </script>
</body>
</html>
