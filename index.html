<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎮 Godbreaker's Game Library</title>
  <style>
    :root {
      --bg: #0f0f13; --card: #1a1a24; --text: #e6e6ef;
      --accent: #7c5cff; --border: #3a3a50; --muted: #8888aa;
      --c-red: #ef4444; --c-yellow: #fbbf24; --c-green: #4ade80; --c-purple: #7c5cff;
      --review-bg: #15151c; --review-text: #e0e0f0;
    }
    [data-theme="light"] {
      --bg: #f5f5fa; --card: #ffffff; --text: #1a1a2e;
      --accent: #6c5ce7; --border: #d0d0e0; --muted: #666688;
      --c-red: #dc2626; --c-yellow: #d97706; --c-green: #16a34a; --c-purple: #7c3aed;
      --review-bg: #f8f8ff; --review-text: #2a2a4a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      padding: 16px; line-height: 1.5; transition: background 0.3s, color 0.3s;
    }
    header {
      text-align: center; margin-bottom: 20px; padding: 20px;
      background: linear-gradient(135deg, var(--card), #252535);
      border-radius: 16px; border: 1px solid var(--border);
      position: relative;
    }
    [data-theme="light"] header { background: linear-gradient(135deg, var(--card), #e8e8f5); }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    #stats { color: var(--muted); font-size: 0.95rem; }
    #themeToggle {
      position: absolute; top: 12px; right: 16px;
      background: var(--accent); color: white; border: none;
      padding: 6px 12px; border-radius: 20px; cursor: pointer;
      font-size: 0.9rem; display: flex; align-items: center; gap: 4px;
    }
    #themeToggle:hover { opacity: 0.9; }
    .filters {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
      margin: 12px 0; padding: 12px; background: var(--card);
      border-radius: 12px; border: 1px solid var(--border);
    }
    .filters select, .filters input {
      padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.9rem;
      min-width: 140px;
    }
    .filters input { min-width: 180px; }
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; padding: 12px 12px 0; }
    .game-title { font-weight: 600; font-size: 1rem; line-height: 1.3; flex: 1; }
    .rating {
      color: white; padding: 3px 9px; border-radius: 16px; font-weight: bold; font-size: 0.85rem;
      min-width: 45px; text-align: center; flex-shrink: 0;
    }
    .rating.red { background: var(--c-red); }
    .rating.yellow { background: var(--c-yellow); color: #1a1a24; }
    .rating.green { background: var(--c-green); color: #1a1a24; }
    .rating.purple { background: var(--c-purple); }
    .rating.empty { background: var(--border); color: var(--muted); }
    .verdict {
      display: inline-block; padding: 2px 9px; border-radius: 10px;
      font-size: 0.82rem; font-weight: 600; margin: 0 12px 8px;
    }
    .verdict.пик { background: var(--c-purple); color: white; }
    .verdict.рекомендую { background: var(--c-green); color: #1a1a24; }
    .verdict.можно { background: var(--c-yellow); color: #1a1a24; }
    .verdict.не-рекомендую, .verdict.дроп { background: var(--c-red); color: white; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 0.85rem; color: var(--muted); margin: 0 12px 8px; }
    .review-preview {
      font-size: 0.92rem; color: var(--text); margin: 8px 12px 12px;
      padding-top: 8px; border-top: 1px dashed var(--border); margin-top: auto;
    }
    .review-btn {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--accent); text-decoration: none; font-weight: 500; cursor: pointer;
    }
    .review-btn:hover { text-decoration: underline; }
    /* 📄 Модальное окно обзора */
    #reviewModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto;
      backdrop-filter: blur(5px);
    }
    #reviewModal.active { display: block; }
    .review-container {
      max-width: 900px; margin: 40px auto; padding: 30px;
      background: var(--review-bg); border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .review-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }
    #reviewTitle { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
    #closeReview {
      background: var(--c-red); color: white; border: none;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      font-size: 0.95rem; font-weight: 600;
    }
    #closeReview:hover { opacity: 0.9; }
    #reviewContent {
      color: var(--review-text); line-height: 1.8; font-size: 1.05rem;
      white-space: pre-wrap;
    }
    #reviewContent h1, #reviewContent h2, #reviewContent h3 {
      color: var(--accent); margin: 1.5em 0 0.8em; font-weight: 700;
    }
    #reviewContent p { margin: 0.8em 0; }
    #reviewContent ul, #reviewContent ol { margin: 0.8em 0; padding-left: 2em; }
    #reviewContent li { margin: 0.4em 0; }
    #reviewContent strong { color: var(--accent); font-weight: 700; }
    @media (max-width: 600px) {
      .meta { grid-template-columns: 1fr; }
      .filters { flex-direction: column; align-items: stretch; }
      .filters select, .filters input { min-width: 100%; }
      .review-header { flex-direction: column; gap: 12px; align-items: flex-start; }
      .review-container { margin: 20px; padding: 20px; }
    }
    #reviewContent {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      color: var(--review-text);
    }
    #reviewContent h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      margin: 24px 0 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    #reviewContent h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin: 18px 0 10px;
    }
    #reviewContent strong {
      color: var(--accent);
      font-weight: 600;
    }
    #reviewContent p { margin: 10px 0; }
    /* 🎮 Кнопка Steam */
    .steam-link {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; margin: 0 12px 8px;
      background: linear-gradient(135deg, #1b2838, #2a475e);
      color: #66c0f4; text-decoration: none; border-radius: 6px;
      font-size: 0.8rem; font-weight: 600; width: fit-content;
      transition: all 0.2s; border: 1px solid #1b2838;
    }
    .steam-link:hover {
      background: linear-gradient(135deg, #2a475e, #1b2838);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(102, 192, 244, 0.2);
    }
    [data-theme="light"] .steam-link {
      background: linear-gradient(135deg, #e8f0fe, #d2e3fc);
      color: #1a73e8; border-color: #d2e3fc;
    }
    /* 🎮 Обложки игр */
    .cover-wrapper {
      width: 100%; height: 400px; border-radius: 12px 12px 0 0;
      overflow: hidden; background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
      position: relative; margin-bottom: 12px;
    }
    .game-cover {
      width: 100%; height: 100%; object-fit: cover;
      object-position: center; transition: transform 0.3s;
    }
    .cover-wrapper:hover .game-cover { transform: scale(1.05); }
    .cover-placeholder {
      width: 100%; height: 100%; display: flex;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent), #4a3dff);
      font-size: 4rem; font-weight: bold;
      color: rgba(255, 255, 255, 0.3); text-align: center; padding: 20px;
    }
    /* 🔥 Стили для вкладок */
    .tabs { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
    .tab-btn {
      padding: 12px 24px; background: var(--bg); color: var(--text);
      border: 2px solid var(--border); border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s;
    }
    .tab-btn:hover { background: var(--hover); transform: translateY(-2px); }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white; border-color: var(--accent);
    }
    /* 🔥 Стили для статистики */
    .stats-container { padding: 20px; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .stats-header { text-align: center; margin-bottom: 30px; }
    .stats-header h2 { font-size: 2rem; margin-bottom: 10px; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-bottom: 40px;
    }
    .stat-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; text-align: center;
      transition: transform 0.2s;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
    .stat-card h3 { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 10px; }
    .stat-card p { font-size: 2rem; font-weight: bold; color: var(--accent); margin: 0; }
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
    .chart-container {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .chart-container h3 { text-align: center; margin-bottom: 20px; color: var(--text); }
    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
      .tabs { flex-direction: column; }
      .tab-btn { width: 100%; }
    }
  </style>
</head>

  <header>
    <h1>🎮 Библиотека пройденных игр</h1>
    <p id="stats">Загрузка...</p>
    <button id="themeToggle">🌞 Тема</button>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('games')">🎮 Все игры</button>
      <button class="tab-btn" onclick="switchTab('stats')">📊 Статистика</button>
    </div>
  </header>

  <div class="filters">
    <select id="filterVerdict">
      <option value="">Все вердикты</option>
      <option value="пик">🔥 Пик</option>
      <option value="рекомендую">✅ Рекомендую</option>
      <option value="можно попробовать">🤔 Можно попробовать</option>
      <option value="не рекомендую">❌ Не рекомендую</option>
      <option value="дроп">🗑️ Дроп</option>
    </select>
    <select id="filterGenre"><option value="">Все жанры</option></select>
    <input type="text" id="search" placeholder="🔍 Поиск по названию..." />
    <select id="sortBy">
      <option value="date-desc">Сначала новые</option>
      <option value="date-asc">Сначала старые</option>
      <option value="rating-desc">По оценке ↑</option>
      <option value="rating-asc">По оценке ↓</option>
      <option value="hours-desc">По часам ↑</option>
      <option value="has-review">Есть обзор ↓</option>
    </select>
  </div>

  <div id="gamesGrid" class="games-grid"></div>

  <div id="statsContainer" class="stats-container" style="display: none;">
    <div class="stats-header"><h2>📈 Общая статистика</h2></div>
    <div class="stats-grid">
      <div class="stat-card"><h3>🎮 Всего игр</h3><p id="totalGames">0</p></div>
      <div class="stat-card"><h3>⏱️ Всего часов</h3><p id="totalHours">0</p></div>
      <div class="stat-card"><h3>⭐ Средняя оценка</h3><p id="avgRating">0</p></div>
      <div class="stat-card"><h3>🏆 Средний % достижений</h3><p id="avgAchievements">0%</p></div>
    </div>
    <div class="charts-grid">
      <div class="chart-container"><h3>📊 Игры по жанрам</h3><canvas id="genreChart"></canvas></div>
      <div class="chart-container"><h3>🎯 Распределение оценок</h3><canvas id="ratingChart"></canvas></div>
      <div class="chart-container"><h3>📅 Игр пройдено по годам</h3><canvas id="yearChart"></canvas></div>
      <div class="chart-container"><h3>⏱️ Часов по жанрам</h3><canvas id="hoursChart"></canvas></div>
    </div>
  </div>

  <div id="reviewModal">
    <div class="review-container">
      <div class="review-header">
        <h2 id="reviewTitle">Название игры</h2>
        <button id="closeReview">✕ Закрыть</button>
      </div>
      <div id="reviewContent"></div>
    </div>
  </div>

    let games = GAMES_DATA;
    let currentFilter = {verdict: '', genre: '', search: '', sort: 'date-desc'};

    function fmtVerdict(v) {
      if (!v) return '';
      const key = v.toLowerCase().trim();
      if (key.includes('пик')) return `<span class="verdict пик">Пик</span>`;
      if (key.includes('рекомендую') && !key.includes('не')) return `<span class="verdict рекомендую">Рекомендую</span>`;
      if (key.includes('можно')) return `<span class="verdict можно">Можно попробовать</span>`;
      if (key.includes('не рекомендую') || key.includes('дроп')) return `<span class="verdict не-рекомендую">${v}</span>`;
      return `<span class="verdict можно">${v}</span>`;
    }

    function fmtNum(val) {
      if (!val && val !== 0) return '';
      const n = parseFloat(val);
      return isNaN(n) ? val : n % 1 === 0 ? n.toString() : n.toFixed(1);
    }

    function getRatingClass(rating) {
      if (rating === null || rating === undefined || isNaN(rating)) return 'empty';
      if (rating <= 4) return 'red';
      if (rating <= 6) return 'yellow';
      if (rating <= 8) return 'green';
      return 'purple';
    }

    function getInitials(name) {
      if (!name) return '??';
      return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    function renderGames(list) {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';
      if (!list.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Ничего не найдено 😕</p>';
        return;
      }
      list.forEach(g => {
        const card = document.createElement('div');
        card.className = 'card';
        const hours = g.hours ? `${fmtNum(g.hours)} ч` : '';
        let displayGenre = (g.genre || '—').replace(', Стелс', '').trim();
        const genreIcons = {
          'ХОРРОР': '👻', 'SOULSLIKE': '💀', 'RPG': '🛡️', 'JRPG': '🏯', 'ROUGELIKE': '🎲',
          'ЭКШЕН-ПРИКЛЮЧЕНИЕ': '🗡️', 'ЭКШЕН': '⚔️', 'КИНО': '🎬', 'ПЛАТФОРМЕР': '🏃',
          'СТРАТЕГИЯ': '♟️', 'НОВЕЛЛА': '📖', 'СЛЭШЕР': '🗡️', 'МЕТРОИДВАНИЯ': '🦇', 'СИМУЛЯТОР ХОДЬБЫ': '🚶'
        };
        const genreIcon = genreIcons[displayGenre] || '🎮';
        const ach = g.achievements || '';
        const pct = g.percent ? `(${g.percent}%)` : '';
        const rating = (g.rating !== null && g.rating !== undefined) ? `${g.rating}/10` : '–';
        const ratingClass = getRatingClass(g.rating);
        let reviewHtml = g.review ? `<div class="review-preview"><span class="review-btn" data-game="${g.name}">📄 Читать обзор →</span></div>` : '';
        const steamBtn = g.steamUrl ? `<a href="${g.steamUrl}" target="_blank" class="steam-link">🎮 Steam</a>` : '';
        card.innerHTML = `
          <div class="cover-wrapper">
            ${g.cover 
              ? `<img src="${g.cover}" alt="${g.name}" class="game-cover" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="cover-placeholder" style="display:none;">${getInitials(g.name)}</div>`
              : `<div class="cover-placeholder">${getInitials(g.name)}</div>`
            }
          </div>
          <div class="card-header"><div class="game-title">${g.name}</div><div class="rating ${ratingClass}">${rating}</div></div>
          ${steamBtn}
          <div style="padding:0 12px">${fmtVerdict(g.verdict)}</div>
          <div class="meta">
            <div>${genreIcon} ${displayGenre}</div><div>📅 ${g.date || '—'}</div>
            <div>⏱ ${hours}</div><div>${ach ? '🏆 ' + ach : ''} ${pct}</div>
          </div>
          ${reviewHtml}
        `;
        grid.appendChild(card);
        const reviewBtn = card.querySelector('.review-btn');
        if (reviewBtn) {
          reviewBtn.addEventListener('click', (e) => { e.stopPropagation(); openReview(g.name, g.review); });
        }
      });
    }

    function openReview(gameName, reviewKey) {
      const modal = document.getElementById('reviewModal');
      const titleEl = document.getElementById('reviewTitle');
      const contentEl = document.getElementById('reviewContent');
      titleEl.textContent = gameName;
      contentEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted);">⏳ Загрузка...</div>';
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
      const reviewText = REVIEWS[reviewKey];
      if (reviewText) {
        let formatted = reviewText.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
        contentEl.innerHTML = '<p>' + formatted + '</p>';
      } else {
        contentEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--c-red);">❌ Обзор не найден</div>';
      }
    }

    function closeReview() {
      document.getElementById('reviewModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function updateStats(list) {
      const statsEl = document.getElementById('stats');
      const total = list.length;
      const rated = list.filter(g => g.rating !== null && g.rating !== undefined);
      const avg = rated.length ? (rated.reduce((s,g) => s + g.rating, 0) / rated.length).toFixed(1) : '–';
      const totalHours = list.reduce((s,g) => s + (parseFloat(g.hours) || 0), 0).toFixed(1);
      statsEl.textContent = `Игр: ${total} | Ср. оценка: ${avg} | Всего часов: ${totalHours}`;
    }

    function populateGenres(list) {
      const select = document.getElementById('filterGenre');
      while (select.options.length > 1) select.remove(1);
      const genres = [...new Set(list.map(g => {
        if (!g.genre) return null;
        return g.genre.replace(', СТЕЛС', '').trim();
      }).filter(Boolean))].sort();
      genres.forEach(genre => {
        const opt = document.createElement('option');
        opt.value = genre;
        opt.textContent = genre;
        select.appendChild(opt);
      });
    }

    function filterAndRender() {
      let filtered = games.filter(g => {
        const v = (g.verdict || '').toLowerCase();
        const filterV = currentFilter.verdict.toLowerCase();
        const matchV = !currentFilter.verdict || v === filterV;
        const matchG = !currentFilter.genre || g.genre === currentFilter.genre;
        const matchS = !currentFilter.search || g.name.toLowerCase().includes(currentFilter.search);
        return matchV && matchG && matchS;
      });
      const [field, order] = currentFilter.sort.split('-');
      const mult = order === 'asc' ? 1 : -1;
      filtered.sort((a,b) => {
        if (field === 'rating') {
          const ra = a.rating !== null ? a.rating : -1;
          const rb = b.rating !== null ? b.rating : -1;
          return (ra - rb) * mult;
        }
        if (field === 'hours') {
          const ha = parseFloat(a.hours) || 0;
          const hb = parseFloat(b.hours) || 0;
          return (ha - hb) * mult;
        }
        if (field === 'date') {
          const parse = d => { if (!d) return 0; const [day,mon,yr] = d.split('.'); return new Date(yr, mon-1, day).getTime() || 0; };
          return (parse(a.date) - parse(b.date)) * mult;
        }
        if (field === 'has' || currentFilter.sort === 'has-review') {
          const aHas = a.review ? 1 : 0;
          const bHas = b.review ? 1 : 0;
          return (bHas - aHas);
        }
        return 0;
      });
      renderGames(filtered);
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      const toggle = document.getElementById('themeToggle');
      if (saved) { document.documentElement.setAttribute('data-theme', saved); updateThemeIcon(saved); }
      else { document.documentElement.setAttribute('data-theme', 'dark'); updateThemeIcon('dark'); }
      if (toggle) {
        toggle.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          updateThemeIcon(next);
          const statsContainer = document.getElementById('statsContainer');
          if (statsContainer && statsContainer.style.display !== 'none') renderStatistics();
        });
      }
    }

    function updateThemeIcon(theme) {
      const toggle = document.getElementById('themeToggle');
      if (toggle) toggle.textContent = theme === 'dark' ? '🌞 Тема' : '🌙 Тема';
    }

    function getThemeColor() {
      const theme = document.documentElement.getAttribute('data-theme');
      return theme === 'dark' ? '#aaa' : '#333';
    }

    function getGridColor() {
      const theme = document.documentElement.getAttribute('data-theme');
      return theme === 'dark' ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
    }

    function switchTab(tab) {
      const gamesGrid = document.getElementById('gamesGrid');
      const statsContainer = document.getElementById('statsContainer');
      const tabBtns = document.querySelectorAll('.tab-btn');
      if (tab === 'games') {
        gamesGrid.style.display = 'grid';
        statsContainer.style.display = 'none';
        tabBtns[0].classList.add('active');
        tabBtns[1].classList.remove('active');
      } else {
        gamesGrid.style.display = 'none';
        statsContainer.style.display = 'block';
        tabBtns[0].classList.remove('active');
        tabBtns[1].classList.add('active');
        renderStatistics();
      }
    }

    function renderStatistics() {
      const totalGames = games.length;
      const totalHours = games.reduce((sum, g) => sum + (parseFloat(g.hours) || 0), 0);
      const ratedGames = games.filter(g => g.rating !== null && g.rating !== undefined);
      const avgRating = ratedGames.length ? (ratedGames.reduce((sum, g) => sum + g.rating, 0) / ratedGames.length).toFixed(1) : 0;
      const avgAchievements = games.length ? (games.reduce((sum, g) => sum + (parseFloat(g.percent) || 0), 0) / games.length).toFixed(1) : 0;
      document.getElementById('totalGames').textContent = totalGames;
      document.getElementById('totalHours').textContent = totalHours.toFixed(1) + ' ч';
      document.getElementById('avgRating').textContent = avgRating + '/10';
      document.getElementById('avgAchievements').textContent = avgAchievements + '%';
      document.querySelectorAll('canvas').forEach(canvas => { const chart = Chart.getChart(canvas); if (chart) chart.destroy(); });
      
      // График 1: Игры по жанрам
      const genreCount = {};
      games.forEach(g => { const genre = g.genre || 'Без жанра'; genreCount[genre] = (genreCount[genre] || 0) + 1; });
      new Chart(document.getElementById('genreChart'), {
        type: 'doughnut',
        data: { labels: Object.keys(genreCount), datasets: [{ data: Object.values(genreCount), backgroundColor: ['#667eea','#764ba2','#f093fb','#4facfe','#43e97b','#fa709a','#fee140','#30cfd0','#a8edea','#fed6e3'] }] },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: getComputedStyle(document.body).getPropertyValue('--text') } } } }
      });
      
      // График 2: Распределение оценок
      const ratingRanges = { '0-2': 0, '3-4': 0, '5-6': 0, '7-8': 0, '9-10': 0 };
      ratedGames.forEach(g => {
        if (g.rating <= 2) ratingRanges['0-2']++;
        else if (g.rating <= 4) ratingRanges['3-4']++;
        else if (g.rating <= 6) ratingRanges['5-6']++;
        else if (g.rating <= 8) ratingRanges['7-8']++;
        else ratingRanges['9-10']++;
      });
      const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
      const txtColor = isDark ? '#d0d0d0' : '#333333';
      const gridCol = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
      new Chart(document.getElementById('ratingChart'), {
        type: 'bar',
        data: { labels: Object.keys(ratingRanges), datasets: [{ label: 'Количество игр', data: Object.values(ratingRanges), backgroundColor: isDark ? 'rgba(124, 92, 255, 0.8)' : 'rgba(102, 126, 234, 0.8)' }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: gridCol }, ticks: { color: txtColor } }, x: { grid: { display: false }, ticks: { color: txtColor } } } }
      });
      
      // График 3: Игр пройдено по годам
      const yearCount = {};
      games.forEach(g => { if (g.date) { const year = g.date.split('.').pop(); yearCount[year] = (yearCount[year] || 0) + 1; } });
      new Chart(document.getElementById('yearChart'), {
        type: 'line',
        data: { labels: Object.keys(yearCount).sort(), datasets: [{ label: 'Игр пройдено', data: Object.keys(yearCount).sort().map(y => yearCount[y]), borderColor: getThemeColor() === '#aaa' ? '#7c5cff' : '#667eea', backgroundColor: getThemeColor() === '#aaa' ? 'rgba(124, 92, 255, 0.2)' : 'rgba(102, 126, 234, 0.2)', fill: true, tension: 0.4 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: getGridColor() }, ticks: { color: getThemeColor() } }, x: { grid: { display: false }, ticks: { color: getThemeColor() } } } }
      });
      
      // График 4: Часов по жанрам
      const genreHours = {};
      games.forEach(g => { const genre = g.genre || 'Без жанра'; genreHours[genre] = (genreHours[genre] || 0) + (parseFloat(g.hours) || 0); });
      new Chart(document.getElementById('hoursChart'), {
        type: 'bar',
        data: { labels: Object.keys(genreHours), datasets: [{ label: 'Часов', data: Object.values(genreHours), backgroundColor: '#764ba2' }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: getComputedStyle(document.body).getPropertyValue('--text-secondary') } }, x: { ticks: { color: getThemeColor() } } } }
      });
    }

    function init() {
      initTheme();
      populateGenres(games);
      updateStats(games);
      filterAndRender();
      document.getElementById('closeReview').addEventListener('click', closeReview);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeReview(); });
      document.getElementById('reviewModal').addEventListener('click', (e) => { if (e.target.id === 'reviewModal') closeReview(); });
      document.getElementById('filterVerdict').addEventListener('change', (e) => { currentFilter.verdict = e.target.value; filterAndRender(); });
      document.getElementById('filterGenre').addEventListener('change', (e) => { currentFilter.genre = e.target.value; filterAndRender(); });
      document.getElementById('search').addEventListener('input', (e) => { currentFilter.search = e.target.value.toLowerCase(); filterAndRender(); });
      document.getElementById('sortBy').addEventListener('change', (e) => { currentFilter.sort = e.target.value; filterAndRender(); });
      console.log(`✅ Загружено ${games.length} игр`);
    }

    init();
  </script>
</body>
</html>
